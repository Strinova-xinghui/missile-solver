# `missile-solver` —— War Thunder ARH 主动弹的纯求解器包
#
# 设计口径（与现有仓 `E:\导弹包线图-release` 的关系见 README）：
#   * **只抽求解器内核 + 求解层**：无 GUI、无出图、无产物 ⇒ 依赖里**不许有 matplotlib**；
#   * 内核 `kernel/wt_missile.py` **逐字节**保留 ⇒ `solver.SOLVER_SHA256` 仍是同一个值；
#   * 游戏数据**不入库、不随包** ⇒ 运行期由环境变量 `DATA_DIR` 给（见 data/README.md）。
#
# 许可：**GNU Affero General Public License, Version 3**（SPDX `AGPL-3.0-only`）。
# 根目录 `LICENSE` 是与现有仓**同一份**官方英文正文（逐字未改，含 preamble）。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "missile-solver"
version = "0.1.0"
description = "War Thunder 主动雷达弹的纯 Python 6DOF 求解器（内核 + 求解层；无 GUI / 无出图 / 无产物）"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "卡拉彼丘活了喵" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["war-thunder", "missile", "6dof", "simulation", "solver"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  # ⚠ 这里**不放** `License :: OSI Approved :: GNU Affero General Public License v3`：
  # PEP 639 起 license classifier 与 SPDX 表达式二选一，setuptools ≥77 会直接
  # `InvalidConfigError: License classifiers have been superseded by license expressions`
  # （实测：本机 pip wheel 就是这么炸的）。许可身份由上面的 `license = "AGPL-3.0-only"` 表达。
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
# 运行期**只要 numpy**（内核的硬要求）。⚠ 不许加 matplotlib —— 本包不出图。
dependencies = [
  "numpy>=2.5.2,<3",
]

[project.urls]
Homepage = "https://github.com/Strinova-xinghui/missile-solver"
Source = "https://github.com/Strinova-xinghui/missile-solver"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 内核源码是**包数据**（不 import，只被复制到宿主目录），必须随 wheel 走。
"missile_solver" = ["py.typed", "kernel/*.py"]
